[package]
name = "keys-db"
version = "0.1.0"
edition = "2024"

[dependencies]
colored = "3.0.0"
redis = { version = "0.31.0", features = ["aio", "tokio-comp"] }
redis_rs = "0.9.0"
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
tokio = { version = "1.45.0", features = ["full"] }
