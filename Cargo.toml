[package]
name = "sg_assistant"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
poise = { version = "0.6.1", features = ["collector"] }
reqwest = { version = "0.12.7", features = ["json"] }
serde_json = "1.0.128"
serde_yaml = "0.9.34"
tokio = { version = "1.39.2", features = ["rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber =  { version = "0.3.19", features = ["chrono", "env-filter"] }
