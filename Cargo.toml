[package]
name = "sg_assistant"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
poise = { version = "0.6.1", features = ["cache", "chrono", "collector"] }
redis = { version = "0.31.0", features = ["tokio-comp"] }
reqwest = { version = "0.12.7", features = ["json"] }
serde_json = "1.0.128"
serde_yaml = "0.9.34"
tokio = { version = "1.39.2", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.19"
